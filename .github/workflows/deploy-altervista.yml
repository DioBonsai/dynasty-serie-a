name: Deploy su Altervista

on:
  push:
    branches: [master]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ALTERVISTA_FTP_SERVER }}
          username: ${{ secrets.ALTERVISTA_FTP_USERNAME }}
          password: ${{ secrets.ALTERVISTA_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/quizzotti/tests/**
            **/quizzotti/node_modules/**
