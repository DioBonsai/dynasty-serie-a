<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b12"/>
      <stop offset="1" stop-color="#0b0906"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b25c"/>
      <stop offset=".55" stop-color="#c9902f"/>
      <stop offset="1" stop-color="#7a4f16"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d1"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a5c1c"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="42" fill="url(#bg)"/>

  <!-- corona d'alloro: simbolo di presidenza/autorità, a differenziare il logo del gioco
       dagli stemmi procedurali dei singoli club (sempre scudo/tondo/esagono + stella, mai
       con l'alloro) -->
  <g id="laurel-left" fill="url(#leaf)" stroke="#3a2410" stroke-width="1">
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(60,180) rotate(160)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(45,172) rotate(182)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(32,157) rotate(203)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(22,138) rotate(222)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(17,116) rotate(239)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(16,92) rotate(254)"/>
    <path d="M0,0 C-6,-9 -6,-21 0,-30 C6,-21 6,-9 0,0 Z" transform="translate(20,69) rotate(267)"/>
  </g>
  <use href="#laurel-left" transform="translate(200,0) scale(-1,1)"/>
  <!-- nastro alla base, a legare le due fronde -->
  <path d="M78,183 Q100,193 122,183 L122,190 Q100,200 78,190 Z" fill="#7a4f16" stroke="#3a2410" stroke-width="1"/>

  <!-- scudo -->
  <path d="M100 30 L158 52 V102 C158 142 132 170 100 184 C68 170 42 142 42 102 V52 Z"
        fill="url(#shield)" stroke="#3a2410" stroke-width="2.5"/>
  <path d="M100 30 L158 52 V102 C158 142 132 170 100 184 C68 170 42 142 42 102 V52 Z"
        fill="none" stroke="#ffe9b0" stroke-width="1.5" opacity=".55"/>

  <!-- stella -->
  <path d="M100 58 L111 89 L144 90 L118 111 L127 143 L100 124 L73 143 L82 111 L56 90 L89 89 Z"
        fill="url(#star)" stroke="#7a4f16" stroke-width="2" stroke-linejoin="round"/>
</svg>
